name: Zero Downtime CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest

      - name: Run Tests
        run: python -m pytest -v

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: Static Application Security Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit Security Scan
        run: bandit -r . -x ./tests -ll

  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@v0.34.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  docker-build:
    name: Docker Build and Image Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t zerodowntime-cicd:${{ github.sha }} .

      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@v0.34.0
        with:
          image-ref: zerodowntime-cicd:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  dast:
    name: OWASP ZAP Dynamic Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Start Application
        run: |
          if [ -f app.py ]; then
            nohup python app.py > app.log 2>&1 &
          else
            echo "app.py not found"
            exit 1
          fi

      - name: Wait for Application
        run: |
          for i in {1..30}; do
            if curl --fail http://127.0.0.1:5000/; then
              echo "Application is ready"
              exit 0
            fi
            sleep 2
          done

          echo "Application did not become ready"
          cat app.log
          exit 1

      - name: Run OWASP ZAP Baseline Scan
        run: |
          docker run --rm \
            --network host \
            -v "$PWD:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:5000/ \
            -m 3 \
            -I \
            -r zap-report.html

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-security-report
          path: zap-report.html
          if-no-files-found: ignore

  compliance:
    name: Release Compliance Gate
    runs-on: ubuntu-latest

    needs:
      - test
      - secret-scan
      - sast
      - dependency-scan
      - docker-build
      - dast

    environment: production-approval

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Release Compliance Gate
        env:
          TEST_RESULT: ${{ needs.test.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          SAST_RESULT: ${{ needs.sast.result }}
          DEPENDENCY_SCAN_RESULT: ${{ needs.dependency-scan.result }}
          DOCKER_RESULT: ${{ needs.docker-build.result }}
          DAST_RESULT: ${{ needs.dast.result }}
        run: |
          python - <<'PY'
          import os
          from compliance_gate import evaluate_compliance

          test_passed = os.environ["TEST_RESULT"] == "success"
          secret_scan_passed = os.environ["SECRET_SCAN_RESULT"] == "success"
          sast_passed = os.environ["SAST_RESULT"] == "success"
          dependency_scan_passed = os.environ["DEPENDENCY_SCAN_RESULT"] == "success"
          docker_passed = os.environ["DOCKER_RESULT"] == "success"
          dast_passed = os.environ["DAST_RESULT"] == "success"

          # This job can start only after the configured environment
          # protection rules have been satisfied.
          approval_present = True

          result = evaluate_compliance(
              sast_passed=sast_passed,
              dependency_scan_passed=dependency_scan_passed,
              approval_present=approval_present,
              tests_passed=test_passed,
          )

          failed_checks = list(result["failed_checks"])

          if not secret_scan_passed:
              failed_checks.append("secret_scan")

          if not docker_passed:
              failed_checks.append("docker_build_and_scan")

          if not dast_passed:
              failed_checks.append("dast")

          release_approved = len(failed_checks) == 0

          print({
              "release_approved": release_approved,
              "failed_checks": failed_checks,
          })

          if not release_approved:
              print("Release blocked:", failed_checks)
              raise SystemExit(1)

          print("All required checks passed.")
          print("Release compliance gate approved.")
          PY
