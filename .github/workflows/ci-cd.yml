
name: Zero Downtime CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate and Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check README
        run: test -s README.md

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run automated tests
        run: python -m pytest tests/ -v
      
      - name: Python SAST Security Scan
        run: |
          python -m pip install bandit
          bandit -r app.py deployment.py deployment_strategy.py canary_deployment.py database_migration.py compliance_gate.py -ll
      
      - name: Python Dependency Vulnerability Scan
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
      
      - name: Start Application for DAST
        run: |
          python app.py > app.log 2>&1 &
          for i in {1..15}; do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo "Application is ready"
              exit 0
            fi
            sleep 2
          done
          cat app.log
          exit 1

      - name: OWASP ZAP Baseline Security Scan
        run: |
            docker run --rm --user root --network host \
            -v "$PWD:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:8000/health \
            -r /zap/wrk/zap-report.html

      - name: Upload DAST Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-security-report
          path: zap-report.html
          if-no-files-found: ignore
   
