name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest

      - name: Run Tests
        run: |
          export PYTHONPATH="${GITHUB_WORKSPACE}:${PYTHONPATH}"
          python -m pytest -v

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: Static Application Security Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit Security Scan
        run: bandit -r . -x ./tests -ll

  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

  docker-build:
    name: Docker Build and Image Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t zerodowntime-cicd:${{ github.sha }} .

      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: zerodowntime-cicd:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

  dast:
    name: OWASP ZAP Dynamic Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Start Application
        run: |
          nohup python -u app.py > app.log 2>&1 &
          echo $! > app.pid
          sleep 5
          if ! kill -0 "$(cat app.pid)" 2>/dev/null; then
            echo "Application process exited."
            cat app.log
            exit 1
          fi
          cat app.log

      - name: Wait for Application
        run: |
          READY=0
          for i in {1..30}; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/ || true)
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" != "000" ]; then
              echo "Application is responding."
              READY=1
              break
            fi
            sleep 2
          done
          if [ "$READY" -ne 1 ]; then
            echo "Application did not respond on port 8000."
            cat app.log
            exit 1
          fi
          echo "--- / response ---"
          curl -i http://127.0.0.1:8000/ || true
          echo "--- /health response ---"
          curl -i http://127.0.0.1:8000/health || true

      - name: Run OWASP ZAP Baseline Scan
        run: |
          chmod 777 "$PWD"
          docker run --rm \
            --network host \
            -v "$PWD:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:8000/ \
            -m 3 \
            -I \
            -r zap-report.html

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-security-report
          path: zap-report.html
          if-no-files-found: ignore

      - name: Show Application Logs on Failure
        if: failure()
        run: |
          if [ -f app.log ]; then
            cat app.log
          fi

  compliance:
    name: Release Compliance Gate
    runs-on: ubuntu-latest
    needs:
      - test
      - secret-scan
      - sast
      - dependency-scan
      - docker-build
      - dast
    if: always()
    environment: production-approval
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Release Compliance Gate
        env:
          TEST_RESULT: ${{ needs.test.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          SAST_RESULT: ${{ needs.sast.result }}
          DEPENDENCY_SCAN_RESULT: ${{ needs.dependency-scan.result }}
          DOCKER_RESULT: ${{ needs.docker-build.result }}
          DAST_RESULT: ${{ needs.dast.result }}
        run: |
          python - <<'PY'
          import os
          from compliance_gate import evaluate_compliance

          test_passed = os.environ["TEST_RESULT"] == "success"
          secret_scan_passed = os.environ["SECRET_SCAN_RESULT"] == "success"
          sast_passed = os.environ["SAST_RESULT"] == "success"
          dependency_scan_passed = os.environ["DEPENDENCY_SCAN_RESULT"] == "success"
          docker_passed = os.environ["DOCKER_RESULT"] == "success"
          dast_passed = os.environ["DAST_RESULT"] == "success"

          approval_present = True

          result = evaluate_compliance(
              sast_passed=sast_passed,
              dependency_scan_passed=dependency_scan_passed,
              approval_present=approval_present,
              tests_passed=test_passed,
          )

          failed_checks = list(result["failed_checks"])

          if not secret_scan_passed:
              failed_checks.append("secret_scan")
          if not docker_passed:
              failed_checks.append("docker_build_and_scan")
          if not dast_passed:
              failed_checks.append("dast")

          release_approved = len(failed_checks) == 0

          print({
              "release_approved": release_approved,
              "failed_checks": failed_checks,
          })

          if not release_approved:
              print("Release blocked:", failed_checks)
              raise SystemExit(1)

          print("All required checks passed.")
          print("Release compliance gate approved.")
          PY
