
name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest

      - name: Run Python Tests
        run: python -m pytest -v tests/

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: Static Application Security Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: python -m pip install bandit

      - name: Run Bandit
        run: bandit -r . -x ./tests -ll

  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  docker-build:
    name: Build and Scan Docker Image
    runs-on: ubuntu-latest
    needs:
      - test
      - secret-scan
      - sast
      - dependency-scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t zerodowntime-app:${{ github.sha }} .

      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: zerodowntime-app:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  dast:
    name: Dynamic Application Security Testing
    runs-on: ubuntu-latest
    needs:
      - docker-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t novapay-dast:latest .

      - name: Start Application
        run: |
          docker run -d --name novapay-dast \
            -p 127.0.0.1:8000:8000 \
            novapay-dast:latest

      - name: Wait for Application Health
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              echo "Application is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Application did not become healthy"
          docker logs novapay-dast
          exit 1

      - name: Run OWASP ZAP Baseline Scan
        run: |
          docker run --rm \
            --network host \
            -v "$PWD:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:8000 \
            -m 2 \
            -I \
            -r zap-report.html

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-report
          path: zap-report.html
          if-no-files-found: ignore

      - name: Stop Application
        if: always()
        run: docker rm -f novapay-dast || true

  compliance:
    name: Release Compliance Gate
    runs-on: ubuntu-latest
    needs:
      - test
      - secret-scan
      - sast
      - dependency-scan
      - docker-build
      - dast

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Compliance Gate
        run: |
          python - <<'PY'
          from compliance_gate import evaluate_compliance

          result = evaluate_compliance(
              sast_passed=True,
              dependency_scan_passed=True,
              approval_present=False,
              tests_passed=True,
          )

          print(result)

          if not result["release_approved"]:
              print("Release blocked:", result["failed_checks"])
              raise SystemExit(1)
          PY

