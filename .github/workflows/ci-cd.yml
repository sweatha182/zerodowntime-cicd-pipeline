name: Zero Downtime CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  validate:
    name: Validate and Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check README
        run: test -s README.md

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install bandit pip-audit pytest

      - name: Run Tests
        run: |
          if [ -d tests ]; then
            python -m pytest tests -v
          elif [ -f test_app.py ]; then
            python -m pytest test_app.py -v
          else
            echo "No test files found. Skipping tests."
          fi

      - name: Bandit Security Scan
        continue-on-error: true
        run: |
          bandit -r . \
            --exclude ./.git,./.venv,./venv,./zap-output \
            -f txt \
            -o bandit-report.txt

      - name: Dependency Audit
        continue-on-error: true
        run: |
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt \
              --format columns \
              --output pip-audit-report.txt
          else
            echo "No requirements.txt found."
          fi

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: "0"
          severity: HIGH,CRITICAL

      - name: Start Application
        run: |
          if [ -f app.py ]; then
            nohup python app.py > app.log 2>&1 &
          elif [ -f main.py ]; then
            nohup python main.py > app.log 2>&1 &
          else
            echo "ERROR: app.py or main.py was not found."
            exit 1
          fi

      - name: Wait for Application
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health -o /dev/null; then
              echo "Application is running."
              exit 0
            fi
            sleep 2
          done

          echo "Application health check failed."
          cat app.log
          exit 1

      - name: Prepare ZAP Output
        run: mkdir -p "$GITHUB_WORKSPACE/zap-output"

      - name: OWASP ZAP Baseline Scan
        continue-on-error: true
        run: |
          docker pull ghcr.io/zaproxy/zaproxy:stable

          docker run --rm \
            --network host \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE/zap-output:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:8000/health \
            -m 1 \
            -I \
            -r zap-report.html \
            -J zap-report.json

      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-reports
          path: |
            zap-output/zap-report.html
            zap-output/zap-report.json
            bandit-report.txt
            pip-audit-report.txt
            app.log
          if-no-files-found: warn
