
name: Zero Downtime CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check README
        run: test -s README.md

      - name: Validate Workflow File
        run: |
          test -f .github/workflows/ci-cd.yml
          echo "Workflow file exists."

      - name: CI Success
        run: echo "Basic CI checks passed successfully."
